<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tecnovial · Entorno 3D navegado por la palanca</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070B18">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B2FB0'/%3E%3Ccircle cx='16' cy='9' r='3' fill='%23E23B2E'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23FFC21A'/%3E%3Ccircle cx='16' cy='23' r='3' fill='%232FA84F'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,600..900&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--azul:#1B2FB0;--ambar:#FFC21A;--noche:#070B18;--gris:#8B93A7}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--noche);color:#fff;font-family:Figtree,system-ui,sans-serif;overflow:hidden}
.dsp{font-family:Archivo,'Arial Narrow',sans-serif;font-weight:900;text-transform:uppercase;
  font-variation-settings:"wdth" 80;line-height:.94;margin:0}

.view{position:fixed;inset:0;background:#070B18}
.view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.view img.b{opacity:0}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 82% 72% at 50% 48%,transparent 42%,rgba(3,6,14,.88) 100%)}

.copy{position:fixed;left:6vw;bottom:15vh;z-index:20;max-width:min(560px,78vw);
  opacity:0;transform:translateY(16px);transition:opacity .45s ease,transform .45s ease;pointer-events:none}
.copy.on{opacity:1;transform:none;pointer-events:auto}
.copy .tag{display:inline-block;font-family:Archivo,sans-serif;font-weight:800;
  font-variation-settings:"wdth" 86;text-transform:uppercase;font-size:12px;letter-spacing:.16em;
  background:var(--ambar);color:#10142B;padding:6px 13px;border-radius:99px;margin-bottom:14px}
.copy h2{font-size:clamp(30px,4.8vw,58px);margin-bottom:12px;text-shadow:0 4px 30px rgba(0,0,0,.85)}
.copy p{margin:0;color:#D6DCEA;font-size:17px;max-width:44ch;text-shadow:0 2px 16px rgba(0,0,0,.95)}
.copy .row{display:flex;gap:24px;margin-top:18px;flex-wrap:wrap}
.copy .row b{display:block;font-family:Archivo,sans-serif;font-weight:900;
  font-variation-settings:"wdth" 82;font-size:24px;line-height:1}
.copy .row span{font-size:11px;color:var(--gris);text-transform:uppercase;letter-spacing:.12em}

.shifter{position:fixed;right:30px;bottom:30px;z-index:40;background:rgba(9,13,28,.84);
  backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:16px 18px 14px}
.lbl{font-family:Archivo,sans-serif;font-weight:800;font-variation-settings:"wdth" 86;
  text-transform:uppercase;font-size:10.5px;letter-spacing:.18em;color:var(--gris);text-align:center;margin-bottom:10px}
.gate{position:relative;width:168px;height:168px}
.gate svg{position:absolute;inset:0;width:100%;height:100%}
.slot{stroke:rgba(255,255,255,.16);stroke-width:14;stroke-linecap:round;fill:none}
.gbtn{position:absolute;width:42px;height:42px;transform:translate(-50%,-50%);border:0;background:none;
  cursor:pointer;font-family:Archivo,sans-serif;font-weight:900;font-size:16px;color:var(--gris);
  display:grid;place-items:center;transition:color .2s}
.gbtn:hover{color:#fff}
.gbtn.on{color:#10142B}
.gbtn:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
.knob{position:absolute;width:40px;height:40px;border-radius:50%;
  background:linear-gradient(160deg,#fff,#C9CEDC);box-shadow:0 5px 0 #7D8497,0 12px 24px -8px #000;
  transform:translate(-50%,-50%);pointer-events:none;z-index:3;
  transition:left .45s cubic-bezier(.22,.68,.24,1),top .45s cubic-bezier(.22,.68,.24,1)}
.knob::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--azul)}

.hud{position:fixed;left:30px;bottom:30px;z-index:40}
.gear-now{font-family:Archivo,sans-serif;font-weight:900;font-variation-settings:"wdth" 78;
  font-size:64px;line-height:.8}
.gear-now small{display:block;font-family:Figtree,sans-serif;font-weight:600;font-size:10.5px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--gris);margin-top:7px}
.note{position:fixed;left:30px;top:26px;z-index:40;font-size:12px;color:var(--gris);line-height:1.6}
.note b{color:#fff;font-family:Archivo,sans-serif;font-weight:900;font-variation-settings:"wdth" 85;
  text-transform:uppercase;font-size:18px;display:block;margin-bottom:3px}
.load{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--noche);
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gris);transition:opacity .5s}
.load.off{opacity:0;pointer-events:none}
@media(max-width:820px){
  .shifter{right:50%;transform:translateX(50%);bottom:14px;padding:12px 14px 10px}
  .gate{width:134px;height:134px}.knob{width:34px;height:34px}
  .copy{left:5vw;bottom:210px;max-width:88vw}.copy p{font-size:15px}
  .hud{left:18px;bottom:210px}.gear-now{font-size:44px}
  .note{left:18px;top:16px}
}
@media(prefers-reduced-motion:reduce){.knob{transition:none}}
</style>
</head>
<body>

<div class="load" id="load">Cargando entorno…</div>
<div class="note"><b>Tecnovial</b>Entorno renderizado en Blender</div>

<div class="view" id="view">
  <img id="fa" alt="">
  <img id="fb" class="b" alt="">
  <div class="vig"></div>
</div>

<div class="copy" id="copy">
  <span class="tag" id="tag"></span>
  <h2 class="dsp" id="ttl"></h2>
  <p id="txt"></p>
  <div class="row" id="row"></div>
</div>

<div class="hud"><div class="gear-now" id="gearNow">N<small id="gearName">Punto muerto</small></div></div>

<div class="shifter">
  <div class="lbl">Mete una marcha</div>
  <div class="gate" id="gate">
    <svg viewBox="0 0 168 168" aria-hidden="true">
      <path class="slot" d="M25 25 V84 H143 V25"/>
      <path class="slot" d="M25 143 V84 M84 143 V84 M143 143 V84"/>
      <path class="slot" d="M84 25 V84"/>
    </svg>
    <button class="gbtn" data-g="1" style="left:15%;top:15%">1</button>
    <button class="gbtn" data-g="2" style="left:15%;top:85%">2</button>
    <button class="gbtn" data-g="3" style="left:50%;top:15%">3</button>
    <button class="gbtn" data-g="4" style="left:50%;top:85%">4</button>
    <button class="gbtn" data-g="5" style="left:85%;top:15%">5</button>
    <button class="gbtn" data-g="R" style="left:85%;top:85%">R</button>
    <button class="gbtn on" data-g="N" style="left:50%;top:50%">N</button>
    <div class="knob" id="knob" style="left:50%;top:50%"></div>
  </div>
</div>

<script>
(function(){
  var N=16, ORDER=['1','2','3','4','5','R'];
  var POS={N:{x:50,y:50},1:{x:15,y:15},2:{x:15,y:85},3:{x:50,y:15},4:{x:50,y:85},5:{x:85,y:15},R:{x:85,y:85}};
  var DATA={
    N:{tag:'Punto muerto',ttl:'Aprender a conducir<br>tiene sus marchas',
       txt:'Autoescuela en la Macarena desde hace más de diez años. Mete primera y te enseñamos el camino entero.',
       row:[['180 €','Curso permiso B'],['4,9 ★','199 reseñas'],['1ª clase','De regalo']]},
    1:{tag:'Primera',ttl:'Arrancamos',
       txt:'Abrimos tu expediente en la DGT y el mismo día entras en la plataforma de test. Tú solo traes el DNI y una foto.',
       row:[['1 día','En ponerte en marcha'],['180 €','Matrícula y curso']]},
    2:{tag:'Segunda',ttl:'El teórico',
       txt:'Preguntas oficiales de la DGT en el móvil, las 24 horas, y tutorías con tu profesora cuando algo no entra.',
       row:[['24 h','Plataforma de test'],['Incluido','En el curso']]},
    3:{tag:'Tercera',ttl:'Las prácticas',
       txt:'Siempre con la misma profesora, que sabe dónde flojeas. De mañana o de tarde, en las calles por las que vas a examinarte.',
       row:[['25 €','Clase en bono de 10'],['35 €','Clase suelta'],['40 min','Cada clase']]},
    4:{tag:'Cuarta',ttl:'El examen',
       txt:'Vas con el coche de siempre y tu profesora al lado. Si no sale, no hay recargos raros: examen y tasas, nada más.',
       row:[['70 €','Por convocatoria'],['94,05 €','Tasas DGT']]},
    5:{tag:'Quinta',ttl:'Y lo que venga<br>después',
       txt:'Moto con pistas en Sevilla capital, camión y autobús con el Certificado de Aptitud Profesional.',
       row:[['AM · A1 · A2 · A','Moto'],['C · D + CAP','Profesionales']]},
    R:{tag:'Marcha atrás',ttl:'Volver a coger<br>el coche',
       txt:'¿Años sin conducir? Clases sueltas de reciclaje, sin matrícula y sin curso. Se empieza por donde tú digas.',
       row:[['35 €','Clase de 40 min'],['55 €','Clase doble'],['Sin','Matrícula']]}
  };

  var fa=document.getElementById('fa'), fb=document.getElementById('fb'), front=fa, back=fb;
  var knob=document.getElementById('knob'), copy=document.getElementById('copy');
  var gearNow=document.getElementById('gearNow'), gearName=document.getElementById('gearName');
  var load=document.getElementById('load');
  var cache={}, gear='N', busy=false, raf=null;

  function src(g,i){ return 'frames/'+g+'-'+String(i).padStart(2,'0')+'.webp'; }

  /* precarga completa: son 96 fotogramas y 462 KB, cabe de sobra */
  var total=ORDER.length*N, done=0;
  ORDER.forEach(function(g){
    cache[g]=[];
    for(var i=0;i<N;i++){
      (function(g,i){
        var im=new Image();
        im.onload=im.onerror=function(){ if(++done===total){ load.classList.add('off'); } };
        im.src=src(g,i); cache[g][i]=im;
      })(g,i);
    }
  });

  /* doble bufer: evita el parpadeo al cambiar de fotograma */
  function paint(g,i){
    back.src = cache[g][Math.max(0,Math.min(N-1,Math.round(i)))].src;
    var t=front; front=back; back=t;
    front.classList.remove('b'); back.classList.add('b');
  }

  function setCopy(g){
    var d=DATA[g];
    document.getElementById('tag').textContent=d.tag;
    document.getElementById('ttl').innerHTML=d.ttl;
    document.getElementById('txt').textContent=d.txt;
    document.getElementById('row').innerHTML=d.row.map(function(r){
      return '<div><b>'+r[0]+'</b><span>'+r[1]+'</span></div>'; }).join('');
  }

  /* recorre una secuencia de 0 a N-1 o al reves */
  function run(g, from, to, cb){
    var pos=from, dir=to>from?1:-1;
    cancelAnimationFrame(raf);
    (function step(){
      var d=to-pos;
      if(Math.abs(d)<0.08){ paint(g,to); cb&&cb(); return; }
      pos += d*0.16 + dir*0.25;      /* el termino fijo evita quedarse corto al final */
      if((dir>0&&pos>to)||(dir<0&&pos<to)) pos=to;
      paint(g,pos);
      raf=requestAnimationFrame(step);
    })();
  }

  /* como en una caja real, para cambiar de marcha se pasa por el travesano */
  function travel(to){
    if(busy || to===gear) return;
    busy=true;
    knob.style.left=POS[to].x+'%'; knob.style.top=POS[to].y+'%';
    copy.classList.remove('on');
    document.querySelectorAll('.gbtn').forEach(function(b){ b.classList.toggle('on', b.dataset.g===to); });

    function arrive(){
      gear=to; busy=false;
      gearNow.firstChild.nodeValue = to;
      gearName.textContent = DATA[to].tag;
      setCopy(to);
      if(to!=='N') copy.classList.add('on');
      else copy.classList.add('on');
    }
    if(gear!=='N' && to!=='N'){          /* de marcha a marcha: salir y entrar */
      run(gear, N-1, 0, function(){ run(to, 0, N-1, arrive); });
    } else if(gear!=='N'){                /* volver al punto muerto */
      run(gear, N-1, 0, arrive);
    } else {                              /* meter una marcha desde el travesano */
      run(to, 0, N-1, arrive);
    }
  }

  document.querySelectorAll('.gbtn').forEach(function(b){
    b.addEventListener('click',function(){ travel(b.dataset.g); });
  });
  document.addEventListener('keydown',function(e){
    var k=e.key.toUpperCase();
    if(POS[k]){ travel(k); e.preventDefault(); }
  });

  /* arrastre del pomo */
  var gate=document.getElementById('gate'), drag=false;
  function pt(e){ var r=gate.getBoundingClientRect(), t=e.touches?e.touches[0]:e;
    return {x:(t.clientX-r.left)/r.width*100, y:(t.clientY-r.top)/r.height*100}; }
  function nearest(p){ var best='N',bd=1e9;
    for(var k in POS){ var dx=POS[k].x-p.x, dy=POS[k].y-p.y, d=dx*dx+dy*dy; if(d<bd){bd=d;best=k;} }
    return best; }
  gate.addEventListener('mousedown',function(e){ drag=true; knob.style.transition='none'; });
  gate.addEventListener('touchstart',function(e){ drag=true; knob.style.transition='none'; },{passive:true});
  window.addEventListener('mousemove',function(e){ if(!drag)return; var p=pt(e);
    knob.style.left=Math.max(6,Math.min(94,p.x))+'%'; knob.style.top=Math.max(6,Math.min(94,p.y))+'%'; });
  window.addEventListener('touchmove',function(e){ if(!drag)return; var p=pt(e);
    knob.style.left=Math.max(6,Math.min(94,p.x))+'%'; knob.style.top=Math.max(6,Math.min(94,p.y))+'%'; },{passive:true});
  function release(e){ if(!drag)return; drag=false; knob.style.transition='';
    var p=pt(e.changedTouches?{touches:e.changedTouches}:e), g=nearest(p);
    if(g===gear){ knob.style.left=POS[g].x+'%'; knob.style.top=POS[g].y+'%'; } else travel(g); }
  window.addEventListener('mouseup',release); window.addEventListener('touchend',release);

  setCopy('N'); copy.classList.add('on');
  paint('3',0);   /* el fotograma 0 de cualquier secuencia es el punto muerto */
})();
</script>
</body>
</html>
