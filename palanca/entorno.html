<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tecnovial · Entorno 3D controlado por la palanca</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1020">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,600..900&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--azul:#1B2FB0;--ambar:#FFC21A;--noche:#070B18;--gris:#8B93A7}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--noche);color:#fff;font-family:Figtree,system-ui,sans-serif;overflow:hidden}
.dsp{font-family:Archivo,'Arial Narrow',sans-serif;font-weight:900;text-transform:uppercase;
  font-variation-settings:"wdth" 80;line-height:.94;margin:0}

/* el entorno renderizado */
.view{position:fixed;inset:0;background:#070B18}
.view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .06s linear}
.view img.on{opacity:1}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 45%,rgba(3,6,14,.85) 100%)}

/* contenido, aparece al llegar */
.copy{position:fixed;left:6vw;bottom:16vh;z-index:20;max-width:min(560px,80vw);
  opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s ease;pointer-events:none}
.copy.on{opacity:1;transform:none;pointer-events:auto}
.copy .tag{display:inline-block;font-family:Archivo,sans-serif;font-weight:800;
  font-variation-settings:"wdth" 86;text-transform:uppercase;font-size:12px;letter-spacing:.16em;
  background:var(--ambar);color:#10142B;padding:6px 13px;border-radius:99px;margin-bottom:14px}
.copy h2{font-size:clamp(32px,5vw,62px);margin-bottom:12px;text-shadow:0 4px 30px rgba(0,0,0,.8)}
.copy p{margin:0;color:#D3D9E8;font-size:18px;max-width:44ch;text-shadow:0 2px 16px rgba(0,0,0,.9)}

/* palanca */
.shifter{position:fixed;right:30px;bottom:30px;z-index:40;background:rgba(9,13,28,.84);
  backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:16px 18px 14px}
.lbl{font-family:Archivo,sans-serif;font-weight:800;font-variation-settings:"wdth" 86;
  text-transform:uppercase;font-size:10.5px;letter-spacing:.18em;color:var(--gris);text-align:center;margin-bottom:10px}
.gate{position:relative;width:168px;height:168px}
.slot{stroke:rgba(255,255,255,.16);stroke-width:14;stroke-linecap:round;fill:none}
.gate svg{position:absolute;inset:0;width:100%;height:100%}
.gbtn{position:absolute;width:42px;height:42px;transform:translate(-50%,-50%);border:0;background:none;
  cursor:pointer;font-family:Archivo,sans-serif;font-weight:900;font-size:16px;color:var(--gris);
  display:grid;place-items:center}
.gbtn:hover{color:#fff}
.gbtn:disabled{opacity:.3;cursor:not-allowed}
.gbtn:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
.knob{position:absolute;width:40px;height:40px;border-radius:50%;
  background:linear-gradient(160deg,#fff,#C9CEDC);box-shadow:0 5px 0 #7D8497,0 12px 24px -8px #000;
  transform:translate(-50%,-50%);pointer-events:none;z-index:3;transition:left .5s cubic-bezier(.22,.68,.24,1),top .5s cubic-bezier(.22,.68,.24,1)}
.knob::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--azul)}
.load{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;
  font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
.note{position:fixed;left:30px;top:26px;z-index:40;font-size:12px;color:var(--gris);line-height:1.6}
.note b{color:#fff;font-family:Archivo,sans-serif;font-weight:900;font-variation-settings:"wdth" 85;
  text-transform:uppercase;font-size:18px;display:block;margin-bottom:4px}
@media(max-width:820px){
  .shifter{right:50%;transform:translateX(50%);bottom:14px;padding:12px 14px 10px}
  .gate{width:136px;height:136px}.knob{width:34px;height:34px}
  .copy{left:5vw;bottom:230px}.copy p{font-size:15px}
}
</style>
</head>
<body>

<div class="note"><b>Tecnovial</b>Prototipo · entorno renderizado en Blender</div>
<div class="load" id="load">Cargando entorno…</div>

<div class="view" id="view"><div class="vig"></div></div>

<div class="copy" id="copy">
  <span class="tag" id="tag">Tercera</span>
  <h2 class="dsp" id="ttl">Las prácticas</h2>
  <p id="txt">Siempre con la misma profesora, que sabe dónde flojeas. De mañana o de tarde, en las calles por las que vas a examinarte de verdad.</p>
</div>

<div class="shifter">
  <div class="lbl">Mete una marcha</div>
  <div class="gate" id="gate">
    <svg viewBox="0 0 168 168" aria-hidden="true">
      <path class="slot" d="M25 25 V84 H143 V25"/>
      <path class="slot" d="M25 143 V84 M84 143 V84 M143 143 V84"/>
      <path class="slot" d="M84 25 V84"/>
    </svg>
    <button class="gbtn" data-g="1" style="left:15%;top:15%" disabled>1</button>
    <button class="gbtn" data-g="2" style="left:15%;top:85%" disabled>2</button>
    <button class="gbtn" data-g="3" style="left:50%;top:15%">3</button>
    <button class="gbtn" data-g="4" style="left:50%;top:85%" disabled>4</button>
    <button class="gbtn" data-g="5" style="left:85%;top:15%" disabled>5</button>
    <button class="gbtn" data-g="R" style="left:85%;top:85%" disabled>R</button>
    <button class="gbtn" data-g="N" style="left:50%;top:50%">N</button>
    <div class="knob" id="knob" style="left:50%;top:50%"></div>
  </div>
</div>

<script>
(function(){
  var N = 16, GEAR = '3';
  var POS = {N:{x:50,y:50}, 3:{x:50,y:15}};
  var view=document.getElementById('view'), knob=document.getElementById('knob');
  var copy=document.getElementById('copy'), load=document.getElementById('load');
  var frames=[], ready=0, pos=0, target=0, raf=null;

  /* precarga: la secuencia se controla por fotograma, no se reproduce como video,
     asi el gesto de la palanca manda y se puede ir y volver a media transicion */
  for(var i=0;i<N;i++){
    var im=new Image();
    im.src='frames/'+GEAR+'-'+String(i).padStart(2,'0')+'.webp';
    im.onload=function(){ if(++ready===N){ load.style.display='none'; show(0); } };
    im.onerror=function(){ load.textContent='Faltan los fotogramas en frames/'; };
    view.appendChild(im); frames.push(im);
  }
  /* 'pos' es fraccionaria y es el estado real; el fotograma solo se redondea al
     pintar. Guardar el valor redondeado como estado dejaba el bucle atascado
     cuando el paso era menor que medio fotograma. */
  function show(i){
    var f=Math.max(0,Math.min(N-1,Math.round(i)));
    frames.forEach(function(im,k){ im.classList.toggle('on', k===f); });
    copy.classList.toggle('on', f>=N-2);
  }
  function animate(){
    cancelAnimationFrame(raf);
    (function step(){
      var d=target-pos;
      if(Math.abs(d)<0.05){ pos=target; show(pos); return; }
      pos += d*0.18;
      show(pos);
      raf=requestAnimationFrame(step);
    })();
  }
  function go(g){
    target = (g===GEAR) ? N-1 : 0;
    knob.style.left=POS[g].x+'%'; knob.style.top=POS[g].y+'%';
    animate();
  }
  document.querySelectorAll('.gbtn:not([disabled])').forEach(function(b){
    b.addEventListener('click',function(){ go(b.dataset.g); });
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='3') go('3'); if(e.key.toUpperCase()==='N') go('N');
    if(e.key==='ArrowUp') go('3'); if(e.key==='ArrowDown') go('N');
  });
})();
</script>
</body>
</html>
